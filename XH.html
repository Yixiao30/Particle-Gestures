<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D手势粒子交互 - 小禾</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
  canvas { display: block; }
  #video { position: fixed; top: -9999px; left: -9999px; }
  #ui {
    position: fixed; top: 20px; right: 20px; z-index: 10;
    background: rgba(10,10,15,0.8); backdrop-filter: blur(12px);
    padding: 18px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08);
    color: #fff; min-width: 200px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  #ui h3 { font-size: 13px; font-weight: 500; margin-bottom: 12px; opacity: 0.6; letter-spacing: 1px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .btn {
    padding: 7px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.04); color: #aaa; cursor: pointer; font-size: 13px;
    transition: all .2s; user-select: none;
  }
  .btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .btn.active { background: #6c5ce7; border-color: #6c5ce7; color: #fff; }
  input[type=color] { width: 32px; height: 32px; border: none; border-radius: 8px; cursor: pointer; background: none; padding: 0; vertical-align: middle; }
  #status { font-size: 11px; opacity: 0.4; margin-top: 8px; }
  #tip {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10;
    color: rgba(255,255,255,0.25); font-size: 13px; text-align: center;
    pointer-events: none; transition: opacity 1s;
  }
  #fps {
    position: fixed; bottom: 10px; left: 14px; z-index: 10;
    color: rgba(255,255,255,0.3); font-size: 11px; letter-spacing: 0.5px;
    font-variant-numeric: tabular-nums; pointer-events: none;
  }
</style>
</head>
<body>

<div id="ui">
  <h3>✦ 手势粒子 · 小禾</h3>
  <div class="row">
    <label style="font-size:12px;opacity:0.5;line-height:32px;">颜色 </label>
    <input type="color" id="colorPicker" value="#6c5ce7">
    <button class="btn" id="fullscreenBtn">⛶ 全屏</button>
  </div>
  <div id="status">👋 请允许摄像头访问</div>
</div>
<div id="tip">张开 ⇢ 扩散 &nbsp;|&nbsp; 握拳 ⇢ 聚合 &nbsp;|&nbsp; 平移手掌 ⇢ 旋转视角</div>
<div id="fps" title="按 F 显示 / 隐藏">— FPS</div>

<video id="video" playsinline></video>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/AfterimageShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/MaskPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/AfterimagePass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js"></script>

<script>
const PARTICLE_COUNT = 18000;
let scene, camera, renderer, particles, geometry, material;
let composer = null, bloomPass = null;
let positions, targetPositions, starPositions;
let handOpenness = 0.5, targetOpenness = 0.5;
let colorHex = 0x6c5ce7;
let cameraBaseZ = 3.5;
let clock = new THREE.Clock();
let fpsEl = document.getElementById('fps');
let fpsFrames = 0, fpsTime = 0, lowTime = 0, degraded = 0;
// 用 ?noadapt 关闭自动降级，方便截图 / 对比性能
const autoQuality = !location.search.includes('noadapt');


function initThree() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.z = 3.5;
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.body.prepend(renderer.domElement);

  geometry = new THREE.BufferGeometry();
  positions = new Float32Array(PARTICLE_COUNT * 3);
  targetPositions = new Float32Array(PARTICLE_COUNT * 3);
  starPositions = new Float32Array(PARTICLE_COUNT * 3);

  const sizes = new Float32Array(PARTICLE_COUNT);
  const phases = new Float32Array(PARTICLE_COUNT);
  const rarities = new Float32Array(PARTICLE_COUNT);

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = Math.pow(Math.random(), 0.33) * 8;
    starPositions[i*3] = r * Math.sin(phi) * Math.cos(theta);
    starPositions[i*3+1] = r * Math.sin(phi) * Math.sin(theta) * 0.7;
    starPositions[i*3+2] = r * Math.cos(phi);
    positions[i*3] = starPositions[i*3];
    positions[i*3+1] = starPositions[i*3+1];
    positions[i*3+2] = starPositions[i*3+2];
    sizes[i] = 1.4 + Math.random() * 3.2;
    phases[i] = Math.random();
    // 让少数粒子更亮更大，形成“星尘 + 高光”的层次
    rarities[i] = 0.15 + Math.pow(Math.random(), 1.8) * 0.85;
  }

  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
  geometry.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));
  geometry.setAttribute('aRarity', new THREE.BufferAttribute(rarities, 1));
  generateTextPoints();
  computeShape();

  const shaderUniforms = {
    uTime: { value: 0 },
    uPixelRatio: { value: renderer.getPixelRatio() },
    uSpread: { value: 0 },
    uColorA: { value: new THREE.Color(0x4c6fff) },
    uColorB: { value: new THREE.Color(0x6c5ce7) },
    uColorC: { value: new THREE.Color(0xff6bd6) },
  };

  const vertexShader = `
    attribute float aSize;
    attribute float aPhase;
    attribute float aRarity;

    uniform float uTime;
    uniform float uPixelRatio;
    uniform float uSpread;
    uniform vec3 uColorA;
    uniform vec3 uColorB;
    uniform vec3 uColorC;

    varying vec3 vColor;
    varying float vAlpha;

    void main() {
      // 极轻微的呼吸抖动，让静止时也有生命感
      vec3 p = position;
      p.x += sin(uTime * 0.9 + aPhase * 24.0) * 0.006;
      p.y += cos(uTime * 1.1 + aPhase * 18.0) * 0.006;
      p.z += sin(uTime * 1.3 + aPhase * 12.0) * 0.025;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;

      // 每颗粒子独立相位的闪烁
      float twinkle = 0.55 + 0.45 * sin(uTime * (1.2 + aPhase * 1.6) + aPhase * 31.0);

      // 沿 x 轴的三段式渐变（色相 A → B → C）
      float gx = clamp(position.x / 5.0 + 0.5, 0.0, 1.0);
      vec3 col = gx < 0.5
        ? mix(uColorA, uColorB, gx * 2.0)
        : mix(uColorB, uColorC, (gx - 0.5) * 2.0);

      #ifdef GLOW
        // 外层：只保留一部分粒子做大尺寸低透明度光晕
        if (aRarity < 0.5) {
          gl_Position = vec4(0.0, 0.0, -2.0, 1.0);
          gl_PointSize = 0.0;
          vColor = col;
          vAlpha = 0.0;
          return;
        }
        gl_PointSize = aSize * uPixelRatio * (16.0 / max(0.8, -mv.z))
          * (0.8 + 0.6 * aRarity) * (1.0 + uSpread * 1.3);
        vColor = col * (0.7 + 0.15 * twinkle);
        vAlpha = (0.06 + 0.15 * aRarity) * (0.7 + 0.3 * twinkle);
      #else
        // 内层：普通混合，保住渐变色，不再叠成白心
        gl_PointSize = aSize * uPixelRatio * (6.5 / max(0.8, -mv.z))
          * (0.72 + 0.55 * aRarity) * (1.0 + uSpread * 1.1);
        vColor = col * (0.95 + 0.3 * twinkle);
        vAlpha = (0.45 + 0.55 * aRarity) * (0.65 + 0.35 * twinkle)
          * (0.9 + uSpread * 0.1);
      #endif
    }
  `;

  const fragmentShader = `
    varying vec3 vColor;
    varying float vAlpha;

    void main() {
      vec2 uv = gl_PointCoord - vec2(0.5);
      float d = length(uv);
      if (d > 0.5) discard;

      float k = 1.0 - d * 2.0;

      #ifdef GLOW
        float glow = pow(k, 2.5);
        gl_FragColor = vec4(vColor, glow * vAlpha);
      #else
        float body = pow(k, 1.6);
        float core = pow(k, 7.0);
        float alpha = (body * 0.7 + core * 0.5) * vAlpha;
        gl_FragColor = vec4(vColor * (0.9 + core * 0.5), alpha);
      #endif
    }
  `;

  material = new THREE.ShaderMaterial({
    uniforms: shaderUniforms,
    vertexShader,
    fragmentShader,
    transparent: true,
    depthWrite: false,
    depthTest: false,
    blending: THREE.NormalBlending,
  });

  const glowMaterial = new THREE.ShaderMaterial({
    uniforms: shaderUniforms,
    vertexShader,
    fragmentShader,
    defines: { GLOW: 1 },
    transparent: true,
    depthWrite: false,
    depthTest: false,
    blending: THREE.AdditiveBlending,
  });

  const corePoints = new THREE.Points(geometry, material);
  corePoints.renderOrder = 0;
  const glowPoints = new THREE.Points(geometry, glowMaterial);
  glowPoints.renderOrder = 1;
  particles = new THREE.Group();
  particles.add(corePoints);
  particles.add(glowPoints);
  scene.add(particles);

  renderer.setClearColor(0x0a0a0f, 1);

  // 后期处理：Afterimage 拖尾 + UnrealBloom 辉光
  if (THREE.EffectComposer && THREE.RenderPass && THREE.ShaderPass &&
      THREE.AfterimagePass && THREE.UnrealBloomPass) {
    composer = new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene, camera));
    composer.addPass(new THREE.AfterimagePass(0.82));
    bloomPass = new THREE.UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight), 0.7, 0.6, 0.35
    );
    composer.addPass(bloomPass);
  }

  updatePalette(colorHex);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    if (composer) composer.setSize(window.innerWidth, window.innerHeight);
    material.uniforms.uPixelRatio.value = renderer.getPixelRatio();
  });
}

function updatePalette(hex) {
  colorHex = hex;
  if (!material || !material.uniforms) return;
  const base = new THREE.Color(hex);
  const hsl = { h: 0, s: 0, l: 0 };
  base.getHSL(hsl);
  const mk = (dh, satMul, lightMul) => new THREE.Color().setHSL(
    (hsl.h + dh + 1) % 1,
    Math.min(1, hsl.s * satMul),
    Math.min(0.85, Math.max(0.25, hsl.l * lightMul))
  );
  material.uniforms.uColorA.value.copy(mk(-0.05, 1.15, 0.78));
  material.uniforms.uColorB.value.copy(base);
  material.uniforms.uColorC.value.copy(mk(0.12, 1.2, 1.12));
}

let textPoints = [];

function generateTextPoints() {
  // 用 canvas 绘制“小禾”，再按像素采样生成粒子坐标
  const W = 768, H = 512;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 260px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif';
  ctx.fillText('小禾', W / 2, H / 2);

  const data = ctx.getImageData(0, 0, W, H).data;
  const raw = [];
  let minX = W, maxX = 0, minY = H, maxY = 0;
  const step = 2;

  for (let y = 0; y < H; y += step) {
    for (let x = 0; x < W; x += step) {
      if (data[(y * W + x) * 4 + 3] > 128) {
        raw.push(x, y);
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }

  const n = raw.length / 2;
  textPoints = new Float32Array(PARTICLE_COUNT * 3);

  if (n === 0) return;

  const spanX = Math.max(1, maxX - minX);
  const spanY = Math.max(1, maxY - minY);
  const scale = Math.min(3.6 / spanX, 2.0 / spanY);
  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const j = Math.floor(Math.random() * n) * 2;
    textPoints[i * 3] = (raw[j] - cx) * scale + (Math.random() - 0.5) * 0.012;
    textPoints[i * 3 + 1] = (cy - raw[j + 1]) * scale + (Math.random() - 0.5) * 0.012;
    textPoints[i * 3 + 2] = (Math.random() - 0.5) * 0.08;
  }
}

function computeShape() {
  const t = targetPositions;

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    t[i*3] = textPoints[i * 3];
    t[i*3+1] = textPoints[i * 3 + 1];
    t[i*3+2] = textPoints[i * 3 + 2];
  }
}

function initMediaPipe() {
  const hands = new Hands({
    locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`
  });
  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.6,
  });
  hands.onResults(onResults);

  const camera2 = new Camera(document.getElementById('video'), {
    onFrame: async () => { await hands.send({ image: document.getElementById('video') }); },
    width: 640, height: 480,
  });
  camera2.start().then(() => {
    document.getElementById('status').textContent = '🟢 摄像头已就绪';
  }).catch(() => {
    document.getElementById('status').textContent = '⚠️ 摄像头无法访问，可用鼠标拖动视角';
    document.getElementById('tip').textContent = '鼠标拖动旋转 | 滚轮缩放';
    // 没有手势输入时聚合为清晰图形，避免一直停留在星尘扩散状态
    targetOpenness = 0;
    handOpenness = 0;
    enableMouseControl();
  });
}

function onResults(results) {
  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    const lm = results.multiHandLandmarks[0];
    handActive = true;
    handWrist.x = lm[0].x;
    handWrist.y = lm[0].y;
    let totalDist = 0, count = 0;
    const tips = [4, 8, 12, 16, 20];
    for (let i = 0; i < tips.length; i++) {
      for (let j = i+1; j < tips.length; j++) {
        const dx = lm[tips[i]].x - lm[tips[j]].x;
        const dy = lm[tips[i]].y - lm[tips[j]].y;
        totalDist += Math.sqrt(dx*dx + dy*dy);
        count++;
      }
    }
    const avgDist = totalDist / count;
    targetOpenness = Math.min(1, Math.max(0, (avgDist - 0.05) * 4));
    document.getElementById('status').textContent =
      `🖐 手势: ${(targetOpenness * 100).toFixed(0)}%`;
  } else {
    handActive = false;
  }
}

let mouseX = 0, mouseY = 0, mouseControl = false;
let handWrist = { x: 0.5, y: 0.5 }, handActive = false;
function enableMouseControl() {
  mouseControl = true;
  document.addEventListener('mousemove', (e) => {
    mouseX = (e.clientX / window.innerWidth) * 2 - 1;
    mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
  });
  document.addEventListener('wheel', (e) => {
    cameraBaseZ += e.deltaY * 0.005;
    cameraBaseZ = Math.max(1.8, Math.min(9, cameraBaseZ));
  });
}

function setRenderPixelRatio(pr) {
  renderer.setPixelRatio(pr);
  material.uniforms.uPixelRatio.value = pr;
  if (composer) composer.setPixelRatio(pr);
}

function updateFps(rawDt, t) {
  fpsFrames++;
  fpsTime += rawDt;
  if (fpsTime < 0.5) return;

  const fps = fpsFrames / fpsTime;
  fpsFrames = 0;
  fpsTime = 0;

  // 帧率持续偏低时自动降级：先关 Bloom，再降渲染分辨率
  if (autoQuality && t > 3) {
    if (fps < 42) lowTime += 0.5;
    else lowTime = 0;

    if (lowTime >= 3) {
      if (degraded === 0 && bloomPass) {
        bloomPass.enabled = false;
        degraded = 1;
      } else if (degraded === 1 && renderer.getPixelRatio() > 1) {
        setRenderPixelRatio(1);
        degraded = 2;
      }
      lowTime = 0;
    }
  }

  fpsEl.textContent = Math.round(fps) + ' FPS' +
    (degraded === 1 ? ' · 已关 Bloom' : degraded === 2 ? ' · 性能模式' : '');
}

function animate() {
  requestAnimationFrame(animate);
  const rawDt = clock.getDelta();
  const dt = Math.min(rawDt, 0.05);
  const t = clock.elapsedTime;

  updateFps(rawDt, t);

  handOpenness += (targetOpenness - handOpenness) * dt * 4;
  const starBlend = Math.pow(Math.max(0, (handOpenness - 0.4) / 0.6), 1.2);

  material.uniforms.uTime.value = t;
  material.uniforms.uSpread.value = starBlend;

  const pos = geometry.attributes.position.array;
  const spring = Math.min(1, dt * 5);

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const i3 = i * 3;
    const tx = targetPositions[i3] * (1 - starBlend) + starPositions[i3] * starBlend;
    const ty = targetPositions[i3+1] * (1 - starBlend) + starPositions[i3+1] * starBlend;
    const tz = targetPositions[i3+2] * (1 - starBlend) + starPositions[i3+2] * starBlend;

    // 弹簧回归目标位置
    pos[i3] += (tx - pos[i3]) * spring;
    pos[i3+1] += (ty - pos[i3+1]) * spring;
    pos[i3+2] += (tz - pos[i3+2]) * spring;
  }

  geometry.attributes.position.needsUpdate = true;

  if (handActive) {
    const targetY = (0.5 - handWrist.x) * 4;
    particles.rotation.y += (targetY - particles.rotation.y) * dt * 3;
  } else if (mouseControl) {
    particles.rotation.y += (mouseX * 0.5 - particles.rotation.y) * dt * 2;
    particles.rotation.x += (mouseY * 0.3 - particles.rotation.x) * dt * 2;
  } else {
    particles.rotation.y += dt * 0.15;
    particles.rotation.x = Math.sin(t * 0.3) * 0.1;
  }

  // 镜头缓慢呼吸，避免画面像一张静止截图
  camera.position.z = cameraBaseZ + Math.sin(t * 0.55) * 0.06;
  camera.position.x = Math.sin(t * 0.23) * 0.05;
  camera.position.y = Math.cos(t * 0.31) * 0.035;
  camera.lookAt(0, 0, 0);

  // 先让上一帧淡出形成拖尾，再画粒子
  if (composer) composer.render();
  else renderer.render(scene, camera);
}

document.getElementById('colorPicker').addEventListener('input', (e) => {
  updatePalette(parseInt(e.target.value.substring(1), 16));
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'f' || e.key === 'F') {
    fpsEl.style.display = fpsEl.style.display === 'none' ? '' : 'none';
  }
});

document.getElementById('fullscreenBtn').addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
});

initThree();
if (location.search.includes('nocam')) {
  // 无摄像头演示模式：直接聚合成目标文字
  document.getElementById('status').textContent = '🎨 演示模式（无摄像头）';
  document.getElementById('tip').textContent = '鼠标拖动旋转 | 滚轮缩放';
  targetOpenness = 0;
  handOpenness = 0;
  for (let i = 0; i < PARTICLE_COUNT * 3; i++) positions[i] = targetPositions[i];
  geometry.attributes.position.needsUpdate = true;
  enableMouseControl();
} else {
  initMediaPipe();
}
animate();

setTimeout(() => { document.getElementById('tip').style.opacity = '0'; }, 8000);
</script>
</body>
</html>
